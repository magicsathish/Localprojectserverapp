name: Build Local Project Server APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Step 1 - Checkout repository
      uses: actions/checkout@v4

    - name: Step 2 - Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Step 3 - Setup Explicit Gradle 8.4
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.4'

    - name: Step 4 - Generate Gradle Wrapper
      working-directory: ./LocalProjectServer
      run: gradle wrapper

    - name: Step 5 - Grant execute permission for gradlew
      working-directory: ./LocalProjectServer
      run: chmod +x gradlew

    - name: Step 6 - Build Debug APK
      working-directory: ./LocalProjectServer
      run: ./gradlew assembleDebug --stacktrace

    - name: Step 7 - Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LocalProjectServer-v1.0.0
        path: LocalProjectServer/app/build/outputs/apk/debug/app-debug.apk
        
