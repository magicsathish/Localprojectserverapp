name: Extract Project ZIP and Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate Project ZIP
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIP_FILES < <(
            find . -maxdepth 1 -type f -iname "*.zip"
          )

          if [ "${#ZIP_FILES[@]}" -ne 1 ]; then
            echo "ERROR: Repository root must contain exactly one ZIP file."
            printf '%s\n' "${ZIP_FILES[@]}"
            exit 1
          fi

          echo "ZIP_FILE=${ZIP_FILES[0]}" >> "$GITHUB_ENV"

      - name: Extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted
          unzip -q -o "$ZIP_FILE" -d extracted

          echo "ZIP extraction completed."

      - name: Detect Actual Android Project Root
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ROOTS < <(
            find extracted -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -printf '%h\n' | sort -u
          )

          if [ "${#ROOTS[@]}" -ne 1 ]; then
            echo "ERROR: Could not identify one unique Android project root."
            printf '%s\n' "${ROOTS[@]}"
            exit 1
          fi

          PROJECT_ROOT="${ROOTS[0]}"

          REQUIRED_FILES=(
            "build.gradle.kts"
            "gradle/libs.versions.toml"
            "gradle/wrapper/gradle-wrapper.properties"
            "app/build.gradle.kts"
            "app/src/main/AndroidManifest.xml"
            "app/src/main/java/com/magic/localprojectserver/MainActivity.kt"
            "app/src/main/java/com/magic/localprojectserver/LocalHttpServer.kt"
            "app/src/main/java/com/magic/localprojectserver/ServerForegroundService.kt"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$PROJECT_ROOT/$FILE" ]; then
              echo "ERROR: Missing required file: $FILE"
              exit 1
            fi
          done

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "Android project root detected: $PROJECT_ROOT"

      - name: Copy Project into Repository Root
        shell: bash
        run: |
          set -euo pipefail

          rsync -a \
            --exclude='.github/workflows/extract-and-build.yml' \
            "$PROJECT_ROOT/" ./

          rm -rf extracted
          rm -f "$ZIP_FILE"

          echo "Project files placed in repository root."

      - name: Verify Project Structure
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle/libs.versions.toml
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo "Project structure verified."

      - name: Commit Extracted Project
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Extract Android project from ZIP"
            git push origin HEAD:main
          fi

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Set Up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail

          gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalProjectServer-v1.0.0
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
