name: Extract ZIP to Repo

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

# ரெப்பாசிட்டரியில் ஃபைல்களை புஷ் செய்ய அனுமதி தேவை
permissions:
  contents: write

jobs:
  unzip-and-commit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unzip the file
      run: |
        # ZIP ஃபைலை ரூட் டைரக்டரியிலேயே எக்ஸ்ட்ராக்ட் செய்கிறது (-o overwrite)
        unzip -o *.zip

    - name: Commit and Push extracted files
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # எக்ஸ்ட்ராக்ட் செய்யப்பட்ட அனைத்து ஃபைல்களையும் சேர்க்கிறது
        git add .
        
        # மாற்றம் இருந்தால் மட்டுமே கமிட் செய்யும்
        git diff --quiet && git diff --staged --quiet || (git commit -m "Extracted project files from ZIP" && git push)
